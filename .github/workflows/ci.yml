name: CI

# Least privilege: the workflow only reads the repository, it never writes to it.
permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      # Full history: the doc checks compare against a base commit.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: npm ci

      # Two separate outputs, because the checks need different things:
      #   range — the commit span to inspect (formula/doc pairing)
      #   base  — only the base commit (append-only ADR check)
      # A branch's first push has an all-zero "before" commit: the range then
      # covers HEAD only, and there is no base to compare against.
      - name: Compute commit range
        id: range
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          else
            BASE="${{ github.event.before }}"
            HEAD_SHA="${{ github.sha }}"
          fi
          if [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            echo "range=HEAD" >> "$GITHUB_OUTPUT"
            echo "base=" >> "$GITHUB_OUTPUT"
          else
            echo "range=$BASE..$HEAD_SHA" >> "$GITHUB_OUTPUT"
            echo "base=$BASE" >> "$GITHUB_OUTPUT"
          fi
          echo "range=$(cat "$GITHUB_OUTPUT" | tail -2 | head -1)"
          echo "base=$(cat "$GITHUB_OUTPUT" | tail -1)"

      - run: npm run typecheck

      - run: npm test

      # Same checks as the local hooks, but over the whole push range instead of
      # a single commit. CHECK_BASE is empty on a first push — the ADR check then
      # stays disabled rather than failing.
      - name: Doc checks
        env:
          CHECK_RANGE: ${{ steps.range.outputs.range }}
          CHECK_BASE: ${{ steps.range.outputs.base }}
        run: npm run check